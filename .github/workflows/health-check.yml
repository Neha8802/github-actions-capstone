name: health-check

on: 
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  schedule_job:
    runs-on: ubuntu-latest
    steps:

      - name: checkout code
        uses: actions/checkout@v4
        
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: pulling latest Docker image
        run: docker pull ${{ vars.DOCKER_USERNAME }}/flask-app:latest 
          

      - name: Run the container in detached mode
        run: |
             docker run -d --name flask-app-test -p 5000:5000 "${{ vars.DOCKER_USERNAME }}/flask-app:latest"
             sleep 5

      - name: checking the status
        id: status_checking
        run: |
          
          if bash ./test_health.sh; then
               STATUS='PASSED'
               echo "Health checked Passed"
            else
               STATUS='FAILED'
               echo 'Health checked Failed'
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" = "FAILED" ]; then
            exit 1
          fi

      - name: stoping and removing the container
        if: always()
        run: |
          docker stop flask-app-test || true
          docker rm flask-app-test || true

      - name: write a summary
        if: always()
        run: |
          echo "## Health Check Report" >> $GITHUB_STEP_SUMMARY
          echo "${{vars.DOCKER_USERNAME}}/flask-app:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.status_checking.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY

          
             

          

      
