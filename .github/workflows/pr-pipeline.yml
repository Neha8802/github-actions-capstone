name: pr-pipeline yaml

on: 
  pull_request:
      branches:
        - main
      types: [ opened, synchronize ]

permissions: 
 contents: read
 pull-requests: write

jobs:
  pr-pipeline:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: '3.12'
      run_test: true

  dependency_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Dependencies for Vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
         
  pr-comment:
    runs-on: ubuntu-latest
    needs: pr-pipeline
    if: ${{ needs.pr-pipeline.result == 'success' }}
    steps:
      - name: PR checks passed for branch
        run: echo "PR checks passed for branch :${{ github.head_ref }}"
        

    
