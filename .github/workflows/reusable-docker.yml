name: docker-build-push

on:
  workflow_call:
    inputs:
      image_name:
        type: string
        required: true
      image_tag:
        type: string
        required: true
    secrets:
      username:
        required: true
      password:
        required: true
    outputs:
      image_url:
        description: "Full pushed Docker image path"
        value: ${{ jobs.docker_build_push.outputs.image_url }}

jobs:
  docker_build_push:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{ steps.image_path.outputs.image_url }}
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Build and push the image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.username }}/${{ inputs.image_name }}:latest
            ${{ secrets.username }}/${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: image_url with the full image path
        id: image_path
        run: |
          FULL_IMAGE="${{ secrets.username }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          echo "image_url=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
