name: docker-build-push

on: 
  workflow_call:
    inputs:
      image_name:
        type: string
      image_tag:
        type: string
    secrets:
      username:
        required: true
      password:
        required: true

jobs:
  docker_build_push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        run: action/checkout@v4

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.github.DOCKER_USERNAME }}
          password: ${{ secrets.github.DOCKERHUB_TOKEN }}

      - name: Build and push the image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tag: ${{ vars.DOCKER_USERNAME }}/${{ inputs.image_name }}:{{ inputs.image_tag }}

      - name: image_url with the full image path
        id: image_path
        run: |
          FULL_IMAGE="${{ vars.DOCKER_USERNAME }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          
  
        
