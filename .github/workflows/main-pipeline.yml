name: main-pipeline

on:
  push:
    branches:
      - main

jobs:
  main-pipeline:
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: '3.12'
      run_test: true

  reusable-docker-workflow:
    needs: main-pipeline
    uses: ./.github/workflows/reusable-docker.yml
    with:
      username: ${{ vars.DOCKER_USERNAME }}
      image_name: flask-app
      image_tag: latest
    secrets:
      password: ${{ secrets.DOCKERHUB_TOKEN }}


  Devsecops-trivy-scan:
    runs-on: ubuntu-latest
    needs: main-pipeline
    steps:
      - name: scanning docker image via trivy
        uses: aquasecurity/trivy-action@master
        with:
          image_name: ${{ vars.DOCKER_USERNAME }}/flask-app:${{ github.sha }}
          format: "table"
          output: "trivy.output.txt"
          severity: "CRITICAL"
          exit: "1"

      - name: create artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-artifact-report
          path: trivy.output.txt

  deploy_job:
    needs: reusable-docker-workflow
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: deploying image to prod
        run: |
          echo "deploying image: ${{ needs.reusable-docker-workflow.outputs.image_url }} to prod"
